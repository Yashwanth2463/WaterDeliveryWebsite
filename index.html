<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Water Delivery Dashboard</title>
<style>
body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin:0; background:#f5f5f5; color:#333; }
.container { max-width:1200px; margin:20px auto; background:#fff; border-radius:15px; padding:20px; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
h1,h2,h3{text-align:center;color:#333;}
select,input,button,textarea{padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;font-size:14px;}
select{width:100%;background:#f0f8ff;}
input[type="password"]{width:100%;border:1px solid #333;}
button{background:#2575fc;color:white;border:none;cursor:pointer;font-weight:bold;margin-top:10px;transition:0.3s;}
button:hover{background:#6a11cb;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #ccc;padding:10px;text-align:center;}
th{background:#2575fc;color:white;}
.hidden{display:none;}
#searchInput{margin-bottom:10px;width:50%;}
.logoutBtn{float:right;width:100px;margin-top:-40px;}
#summaryCards{display:flex;justify-content:space-around;margin-bottom:20px;}
.summaryCard{flex:1;margin:5px;padding:15px;border-radius:10px;color:white;font-weight:bold;text-align:center;}
.cardCustomers{background:#6a11cb;}
.cardCans{background:#2575fc;}
.cardPaid{background:#ff7e5f;}
.cardReturned{background:#feb47b;}
#map,#driverMap{height:400px;margin-top:20px;}
.driverContainer{display:flex; gap:20px;}
.driverContainer > div{flex:1;}
</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<!-- LOGIN -->
<div class="container" id="loginContainer">
  <h1>Smart Water Delivery</h1>
  <select id="roleSelect">
    <option value="">Select Role</option>
    <option value="admin">Admin</option>
    <option value="driver">Driver</option>
  </select>
  <select id="driverSelect" class="hidden">
    <option value="">Select Driver</option>
    <option value="driver1">Driver 1</option>
    <option value="driver2">Driver 2</option>
    <option value="driver3">Driver 3</option>
    <option value="driver4">Driver 4</option>
  </select>
  <input type="password" id="password" placeholder="Enter Password">
  <label><input type="checkbox" id="showPass"> Show Password</label>
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div class="container hidden" id="dashboardContainer">
  <button class="logoutBtn" onclick="logout()">Logout</button>
  <h2 id="dashboardTitle"></h2>
  <p id="dateDisplay"></p>
  <input type="text" id="searchInput" placeholder="Search Customer..." onkeyup="searchTable()">
  <div id="summaryCards"></div>

  <!-- DRIVER VIEW (SIDE-BY-SIDE) -->
  <div id="driverView" class="hidden">
    <h3>My Trip Details</h3>
    <div class="driverContainer">
      <!-- Left: Customer Table -->
      <div>
        <table id="driverTripTable">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Cans Delivered</th>
              <th>Amount Paid</th>
              <th>Cans Returned</th>
              <th>Delivery Time</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <button onclick="exportCSV()">Export CSV</button>
        <button onclick="addCustomerOnMap(driverSelect.value)">Add Customer</button>
      </div>

      <!-- Right: Map -->
      <div>
        <h3>My Route Map</h3>
        <div id="driverMap" style="height:500px;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ELEMENTS
const roleSelect = document.getElementById('roleSelect');
const driverSelect = document.getElementById('driverSelect');
const passwordInput = document.getElementById('password');
const showPass = document.getElementById('showPass');
const loginContainer = document.getElementById('loginContainer');
const dashboardContainer = document.getElementById('dashboardContainer');
const dashboardTitle = document.getElementById('dashboardTitle');
const dateDisplay = document.getElementById('dateDisplay');
const driverView = document.getElementById('driverView');
const driverTripTableBody = document.querySelector('#driverTripTable tbody');
const summaryCards = document.getElementById('summaryCards');

// USERS & DELIVERIES
const users = {driver1:"driver123", driver2:"driver123", driver3:"driver123", driver4:"driver123"};
const deliveries = {
  driver1:[{customer:"Customer A",cans:5,paid:150,returned:1,time:"9:00 AM",notes:""}],
  driver2:[{customer:"Customer B",cans:3,paid:90,returned:0,time:"10:00 AM",notes:""}],
  driver3:[], driver4:[]
};
const driversLocations = {
  driver1:[{name:"Customer A",lat:15.1400,lng:76.9220,cans:5,paid:150,returned:1}],
  driver2:[{name:"Customer B",lat:15.1380,lng:76.9240,cans:3,paid:90,returned:0}],
  driver3:[], driver4:[]
};

// MAP VARIABLES
let driverMap, driverMarker, driverRouteLine;
let addingCustomer=false;

// LOGIN/LOGOUT
roleSelect.addEventListener('change', ()=>{
  if(roleSelect.value==='driver'){driverSelect.classList.remove('hidden'); passwordInput.style.display='block';}
  else {driverSelect.classList.add('hidden'); passwordInput.style.display='block';}
});
showPass.addEventListener('change', ()=>{passwordInput.type = showPass.checked ? 'text':'password';});

function login(){
  let selectedUser = driverSelect.value;
  if(!selectedUser){alert("Select driver"); return;}
  if(users[selectedUser] === passwordInput.value){
    loginContainer.classList.add('hidden');
    dashboardContainer.classList.remove('hidden');
    dateDisplay.innerHTML = "Today's Date: " + new Date().toDateString();
    dashboardTitle.innerText = selectedUser + " Dashboard";
    driverView.classList.remove('hidden');
    loadDriverTable(selectedUser);
    updateSummaryCards(selectedUser);
    loadDriverMap(selectedUser);
  } else{alert("Incorrect Password");}
}

function logout(){
  loginContainer.classList.remove('hidden');
  dashboardContainer.classList.add('hidden');
  driverView.classList.add('hidden');
}

// TABLE FUNCTIONS
function loadDriverTable(driver){
  driverTripTableBody.innerHTML="";
  deliveries[driver].forEach(d=>{
    driverTripTableBody.innerHTML += `<tr>
      <td>${d.customer}</td><td>${d.cans}</td><td>${d.paid}</td><td>${d.returned}</td>
      <td>${d.time}</td><td>${d.notes}</td>
    </tr>`;
  });
}

// SUMMARY CARDS
function updateSummaryCards(driver){
  summaryCards.innerHTML="";
  let data=deliveries[driver];
  let totalCustomers=data.length;
  let totalCans=data.reduce((a,b)=>a+b.cans,0);
  let totalPaid=data.reduce((a,b)=>a+b.paid,0);
  let totalReturned=data.reduce((a,b)=>a+b.returned,0);

  summaryCards.innerHTML = `
    <div class="summaryCard cardCustomers">Total Customers<br>${totalCustomers}</div>
    <div class="summaryCard cardCans">Total Cans<br>${totalCans}</div>
    <div class="summaryCard cardPaid">Total Paid<br>${totalPaid}</div>
    <div class="summaryCard cardReturned">Total Returned<br>${totalReturned}</div>
  `;
}

// EXPORT CSV
function exportCSV(){
  let driver=driverSelect.value;
  let data=deliveries[driver];
  let csv='Customer,Cans Delivered,Amount Paid,Cans Returned,Time,Notes\n';
  data.forEach(d=>{csv+=`${d.customer},${d.cans},${d.paid},${d.returned},${d.time},"${d.notes}"\n`;});
  let blob=new Blob([csv],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${driver}_trip.csv`;
  a.click();
}

// SEARCH
function searchTable(){
  let f=document.getElementById('searchInput').value.toLowerCase();
  let trs=driverTripTableBody.getElementsByTagName("tr");
  for(let i=0;i<trs.length;i++){
    let tds=trs[i].getElementsByTagName("td");let match=false;
    for(let j=0;j<tds.length;j++){if(tds[j].innerText.toLowerCase().includes(f)){match=true;break;}}
    trs[i].style.display=match?"":"none";
  }
}

// MAP
function loadDriverMap(driver){
  driverMap = L.map('driverMap').setView([15.1394,76.9214],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(driverMap);

  // Add customer markers
  driversLocations[driver].forEach(c=>{
    L.marker([c.lat,c.lng]).addTo(driverMap)
    .bindPopup(`<b>${c.name}</b><br>Cans: ${c.cans}<br>Paid: ₹${c.paid}`);
  });

  // Add driver route
  updateDriverRoute(driver);

  // Enable adding customer
  driverMap.on('click', e=>{
    if(!addingCustomer) return;
    const lat=e.latlng.lat, lng=e.latlng.lng;
    const name=prompt("Customer Name:"), cans=parseInt(prompt("Cans:"),10)||1;
    const paid=parseInt(prompt("Paid Amount:"),10)||0, returned=parseInt(prompt("Returned Cans:"),10)||0;
    if(!name) return;
    driversLocations[driver].push({name,lat,lng,cans,paid,returned});
    deliveries[driver].push({customer:name,cans,paid,returned,time:new Date().toLocaleTimeString(),notes:""});
    loadDriverTable(driver);
    updateSummaryCards(driver);
    updateDriverRoute(driver);
    addingCustomer=false;
  });

  // Get driver live position
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos=>{
      const driverLat = pos.coords.latitude, driverLng = pos.coords.longitude;
      driverMarker = L.marker([driverLat, driverLng],{icon:L.icon({iconUrl:'https://cdn-icons-png.flaticon.com/512/252/252025.png',iconSize:[30,30]})}).addTo(driverMap).bindPopup("You are here").openPopup();
      driverMap.setView([driverLat, driverLng],14);
      updateDriverRoute(driver);
    });
  }
}

function updateDriverRoute(driver){
  // Remove existing route line
  if(driverRouteLine) driverMap.removeLayer(driverRouteLine);

  // Get driver location
  let start=[15.1394,76.9214]; // default
  if(driverMarker) start=[driverMarker.getLatLng().lat, driverMarker.getLatLng().lng];

  const routeCoords=[start, ...driversLocations[driver].map(c=>[c.lat,c.lng])];
  driverRouteLine = L.polyline(routeCoords,{color:'blue'}).addTo(driverMap);
  driverMap.fitBounds(driverRouteLine.getBounds());
}

// ADD CUSTOMER
function addCustomerOnMap(driver){
  if(!driver){alert("Select driver!"); return;}
  addingCustomer=true;
  alert("Click on the map to place the new customer.");
}
</script>
</body>
</html>
