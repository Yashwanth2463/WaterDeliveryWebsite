<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Water Delivery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Smart Water Delivery System</h1>

  <div class="order-form">
    <label for="customerName">Customer Name:</label>
    <input type="text" id="customerName" placeholder="Enter your name">

    <label for="orderQuantity">Number of Cans:</label>
    <input type="number" id="orderQuantity" value="1" min="1">

    <label for="paymentType">Payment Type:</label>
    <select id="paymentType">
      <option value="Cash">Cash</option>
      <option value="UPI">UPI</option>
    </select>

    <button onclick="placeOrder()">Place Order</button>
    <button onclick="showInventory()">Check Inventory</button>
  </div>

  <h2>Order Status</h2>
  <div id="status">No orders yet.</div>

  <h2>Order History</h2>
  <table id="orderHistory">
    <tr>
      <th>Customer</th>
      <th>Quantity</th>
      <th>Payment</th>
      <th>Time</th>
    </tr>
  </table>

  <script src="script.js"></script>
</body>
</html>
