<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Water Delivery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Smart Water Delivery System</h1>

    <div id="totalRevenue">Total Revenue: ₹0</div>

    <div class="order-form">
        <label for="customerName">Customer Name:</label>
        <input type="text" id="customerName" placeholder="Enter name">

        <label for="orderQuantity">Quantity (Cans):</label>
        <input type="number" id="orderQuantity" value="1" min="1">

        <label for="paymentType">Payment Type:</label>
        <select id="paymentType">
            <option value="Cash">Cash</option>
            <option value="UPI">UPI</option>
        </select>

        <button onclick="placeOrder()">Place Order</button>
        <button onclick="showInventory()">Check Inventory</button>
    </div>

    <div id="status"></div>

    <h2>Order History</h2>
    <table id="orderHistory">
        <tr>
            <th>Customer</th>
            <th>Quantity</th>
            <th>Payment Type</th>
            <th>Total Price</th>
            <th>Time</th>
        </tr>
    </table>

    <script src="script.js"></script>
</body>
</html>
