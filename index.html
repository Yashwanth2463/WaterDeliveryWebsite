<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Water Delivery System</title>
    <style>
        /* Simple styles for tables and buttons */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        button { margin: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Water Delivery System</h1>

    <!-- Login -->
    <div id="loginDiv">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
    <label for="summaryDate">Select Date:</label>
<input type="date" id="summaryDate">
<button onclick="renderSummaryByDate()">View Summary</button>

    <!-- Dashboard -->
    <div id="dashboard" style="display:none;">
        <h2>Admin Dashboard</h2>

        <!-- Daily Summary -->
        <div id="summaryDiv"></div>

        <!-- Admin Summary -->
        <div id="adminSummaryDiv"></div>
        <button onclick="renderAdminSummary()">View Admin Summary</button>

        <!-- Customer Summary -->
        <div id="customerSummaryDiv"></div>
        <button onclick="renderCustomerSummary()">View Customer Summary</button>

        <!-- Orders & Trip History -->
        <div>
            <button onclick="renderOrders()">View Order History</button>
            <button onclick="renderTrips()">View Trip History</button>
        </div>
    </div>

    <!-- Tables -->
    <h3>Order History</h3>
    <table>
        <thead>
            <tr>
                <th>Customer</th>
                <th>Cans</th>
                <th>Amount</th>
                <th>Payment Type</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="orderHistoryBody"></tbody>
    </table>

    <h3>Trip History</h3>
    <table>
        <thead>
            <tr>
                <th>Driver</th>
                <th>Trip #</th>
                <th>Full Cans</th>
                <th>Empty Cans</th>
                <th>Amount</th>
                <th>Customer Deliveries</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="tripHistoryBody"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
